name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: bash tests/run_tests.sh

      # skill-lint must pass its own strictest run.
      - name: Self-lint
        run: python3 scripts/lint_skills.py . --target spec --strict
